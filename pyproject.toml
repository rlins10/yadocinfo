[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yadocinfo"
version = "0.1.0"
description = "Yet Another Document Information - local document cataloging with AI-generated descriptions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yadocinfo contributors" }]
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "httpx>=0.27",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
mariadb = ["PyMySQL>=1.1"]
postgresql = ["psycopg[binary]>=3.2"]
ocr = ["pytesseract>=0.3.13", "Pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
yadocinfo = "yadocinfo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
